name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -x check_mpic.sh tests/run_tests.sh tests/mock/dig

  test:
    # macOS は標準の bash 3.2 / BSD awk、Ubuntu は bash 5 / mawk で確認する
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: 実行環境
        run: |
          /bin/bash --version | head -n 1
          awk -W version 2>/dev/null | head -n 1 || awk --version 2>/dev/null | head -n 1 || true
      - name: テスト (模擬DNSを使い、ネットワークには接続しない)
        run: tests/run_tests.sh
